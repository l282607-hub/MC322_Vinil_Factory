// Configuracao da construcao do projeto. Sem logica de negocio aqui.

plugins {
    // Compila, empacota e fornece a tarefa 'run' para a aplicacao Java.
    id 'application'
}

group = 'br.unicamp.mc322'
version = '6.0'

// A aplicacao usa a biblioteca padrao; JUnit e usado somente nos testes.
repositories {
    mavenCentral()
}

application {
    // Ponto de entrada do console.
    mainClass = 'br.unicamp.ic.mc322.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs << '-Xlint:all'
}

// ./gradlew run: o programa e interativo, entao precisa receber o teclado.
tasks.named('run') {
    standardInput = System.in
}

// ./gradlew javadoc: documentacao em build/docs/javadoc/index.html
tasks.named('javadoc') {
    options.encoding = 'UTF-8'
    options.windowTitle = 'GroovePress Vinyl Works'
    options.docTitle = 'GroovePress Vinyl Works - API'
    // Verifica tags, referencias e HTML malformado em tudo que e publico.
    options.addBooleanOption('Xdoclint:all', true)
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Mantem o comando das tarefas anteriores, agora usando a suite JUnit.
tasks.register('verificar') {
    group = 'verification'
    description = 'Executa os testes automatizados da planta com JUnit 5.'
    dependsOn tasks.named('test')
}
